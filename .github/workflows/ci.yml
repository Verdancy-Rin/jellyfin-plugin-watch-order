name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Jellyfin.Plugin.WatchOrder.sln --configuration Release

      - name: Test (includes validating every file in orders/)
        run: dotnet test Jellyfin.Plugin.WatchOrder.sln --configuration Release --no-build
