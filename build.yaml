overview: "Watch films and episodes from across a franchise in one defined order."
description: >
  Define viewing orders that mix films and specific episodes from different series
  (for example a chronological Star Wars or MCU order). The plugin matches each entry
  to your library, shows what's missing, and tracks each user's progress so they
  always know what to watch next.
category: "General"
imageUrl: "https://raw.githubusercontent.com/Verdancy-Rin/jellyfin-plugin-watch-order/main/images/watch-order.png"
artifacts:
  - "Jellyfin.Plugin.WatchOrder.dll"
changelog: |
  - New: a redesigned Dashboard page. A side menu splits it into Orders, Add orders and Settings, and it remembers where you were.
  - Orders opens with totals at a glance (orders, people watching, missing items, updates available), then each order with its artwork, its size, a bar of how much of it is in your library, and who's watching. Each order's menu can update it, open it in the web app, export it or delete it, and a filter appears once you have a few orders.
  - Add orders puts New order, Import (drop a file, paste a link or the file itself) and Ready-made orders in one place. Ready-made orders can be filtered and searched.
  - Settings are grouped into panels, with options that depend on another greyed out until it's on, a preview of where the Watch Orders button goes, and a save bar with Discard.
  - The order editor has a clearer header and save bar that shows when you have unsaved changes, a preview of the order's artwork, Find for long orders, Jump to for sections, and Export that includes unsaved changes. Leaving with unsaved changes asks first.
  - The page header shows the plugin's version, whether the web app pages are working, and a notice with the repository to add if File Transformation is missing.
  - A new plugin image.
